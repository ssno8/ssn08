<!DOCTYPE html>

<title>King Slayer ☆</title>
<style>
    body {
        background-image: url(https://i.pinimg.com/1200x/9d/17/10/9d17107215b9019866fc33f2b29596f4.jpg); 
        background-size: 1500px;
        background-attachment: fixed; 
        min-height: 675px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        row-gap: 5px;
    }

    .child1 {
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        background: linear-gradient(180deg, rgba(150, 150, 150, 0.8) 0%, rgba(60, 60, 60, 0.8) 31%, rgba(0, 0, 0, 0.8) 100%); 
        height: 90px;
        width: 500px;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 25px;
        padding-bottom: 10px;
        padding-right: 10px;
        padding-left: 0;
        padding-top: 0;
        border-radius:5px;
        box-shadow: black 0px 0px 2px 3px inset; 
        box-shadow: 0 0 5px black; 
    }

    .child2 {
        background-color: white;
        border: 3px solid rgba(180, 180, 180, 0.8);
        border-radius:5px;
        height: 320px;
        width: 490px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: medium;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        padding-left: 10px;
        padding-top: 0;
        padding-right: 0;
    }

    .child2 p {
        font-family: Arial, Helvetica, sans-serif;
        font-size: medium;
        padding: 5px 50px 5px 5px;
    }

    .child3 {
        background-color: white;
        border: 3px solid rgba(180, 180, 180, 0.8);
        border-right: 0;
        border-radius:5px;
        height: 300px;
        width: 2000px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: medium;
        padding: 10px;
        overflow-y: scroll;
        overflow-x: hidden;
    }

    .child4 {
        background-image: url('https://cdn.pixabay.com/photo/2022/01/30/13/33/github-6980894_1280.png');
        background-size: contain;
        background-position: center;
        flex-direction: grid;
        display: grid;
        justify-content: flex-end;
        align-items: flex-end;
        height: 100px;
        width: 100px;
        background-color: black;
        margin-top: 4px;
        padding: 5px 15px 5px 5px;
        border-radius:5px;
        color: white;
    }

    .child5 {
        background-image: url('https://img.itch.zone/aW1nLzQ2ODE0NzIucG5n/original/WieQ55.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        flex-direction: grid;
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        height: 100px;
        width: 100px;
        background-color: white;
        margin-top: 4px;
        padding: 5px 15px 5px 5px;
        border-radius:5px;
        color: white;
    }

    a:link {
        color: white;
        background-color: transparent;
        text-decoration: none;
    }
    
    a:visited {
        color: white;
        background-color: transparent;
        text-decoration: none;
    }
    
    a:hover {
        color: lightgrey;
        background-color: transparent;
        text-decoration: none;
        transform: scale(0.95); 
        transition: transform 0.3s ease; 
    }
    
    a:active {
      color: white;
      background-color: transparent;
      text-decoration: underline;
    }

</style>
</head>
